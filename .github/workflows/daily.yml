# Daily slug refresh.
#
# Written by `node src/schedule.mjs`. GitHub's cron is **UTC only** — there is
# no timezone field — so this fires at 08:15 UTC year-round and drifts
# relative to local time across daylight saving. Adjust the minute/hour here if
# that matters.
#
# **This syncs the slug store and nothing else.** It used to run the whole
# pipeline — restore a cached database, verify, sweep, derive, report — which
# took 11+ minutes a day to build a database that was thrown away at the end of
# the run. It was thrown away because it never had anywhere to go: the deployed
# site is fed from `data/jobs.db` on the laptop, by hand, with
# `./deploy/upload-db.sh`. The only output of this job that outlived it was
# the slug commit at the bottom, and meanwhile the laptop's own daily run was
# syncing the same slugs to a different answer and fighting this one for the
# file every morning.
#
# So: this owns `data/slugs/`, and the laptop's launchd job runs with
# `--skip-sync` and owns `data/jobs.db`. One writer per file. See the header
# of src/schedule.mjs.
#
# No database is needed here at all — `sync-slugs.mjs` only reads upstream
# company lists and writes JSON. The one thing worth carrying between runs is
# `data/sync-state.json`; see the cache step for why.
name: daily

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  slugs:
    runs-on: ubuntu-latest
    # Minutes, not the 90 the full pipeline needed. Most of it is a few dozen
    # conditional gets against raw.githubusercontent.com; the archive sources
    # add a few minutes of paging against two index servers that answer slowly
    # and retry on a 503. A timeout here kills the run before the commit step,
    # so the slug store would go unwritten for the day — hence the headroom.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # `data/sync-state.json` is gitignored runtime state, which on a laptop
      # simply persists. A runner starts from a fresh checkout every morning, so
      # without this it starts blind: every ETag re-downloaded, every Common
      # Crawl index re-read, and the Wayback window measured from the seed date
      # instead of yesterday. None of that is wrong — the slugs dedupe — but it
      # is minutes of work and load on other people's servers for nothing.
      #
      # The key carries the run id so it never hits and the cache is therefore
      # rewritten every run; `restore-keys` matches the prefix and restores the
      # newest one. Losing it is safe by design: sync-slugs treats a missing
      # validator as a first run, and the archives floor their own lookback.
      - name: Restore the sync bookmarks
        uses: actions/cache@v4
        with:
          path: data/sync-state.json
          key: sync-state-${{ github.run_id }}
          restore-keys: sync-state-

      - name: Sync the slug store
        run: node src/sync-slugs.mjs

      # Slug stores are small and worth keeping in git — they are the part that
      # accumulates, and a diff on them shows which sources moved. This is the
      # commit the laptop fast-forwards to before its own sweep.
      #
      # `if: always()` because a failed source must not cost the day: the
      # sync writes every store to disk before it decides its exit code, and a
      # store missing one source is still correct — a file the run could not
      # read keeps the claims it made last time. So commit what was written and
      # let the red run report which source failed.
      #
      # `data/sync-state.json` is deliberately not in the add list: it is
      # gitignored runtime state, so adding it was always a no-op.
      - name: Commit the slug store
        if: always()
        run: |
          git config user.name  "job-finder-bot"
          git config user.email "job-finder-bot@users.noreply.github.com"
          git add data/slugs data/sync-report.md || true
          if git diff --staged --quiet; then
            echo "slug store unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "daily: slug refresh $(date -u +%F)"
          # A push that fails must fail the run, not vanish into `|| true`: a
          # silent failure here is a slug store that looks maintained and is
          # not. The one benign cause — main moved while this ran — is handled
          # by rebasing once and pushing again.
          git push || (git pull --rebase && git push)

      - name: Upload the sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-report
          path: data/sync-report.md
          retention-days: 30
