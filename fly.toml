# Fly.io deployment for UpstreamIt.
#
# One machine, always on, with one volume at /data holding the three things that
# have to outlive a deploy: the jobs database, the accounts database, and the
# profile files.
#
# `app` is the name of the deployed instance (https://job-finder-ats.fly.dev).
# App names are global across all of Fly, so a fork has to pick its own before
# its first deploy — see docs/deploy.md.

app = "job-finder-ats"
primary_region = "ewr"   # Newark. `fly platform regions` lists the rest.

[build]

[env]
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true

  # Always on. Scale-to-zero would save a few dollars a month, but the filter
  # engine builds a ~427 MB in-memory index at boot and that takes ~3 seconds,
  # so a cold start is a visibly slow first page load. Wrong trade for a link
  # you are putting in front of an employer.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 25
    hard_limit = 50

# One machine only. Each machine gets its own separate volume, so a second one
# would have its own accounts database and sessions would break at random.
[mounts]
  source = "jobdata"
  destination = "/data"

# 4 GB, and it has to be shared-cpu-2x to get there: Fly caps shared-cpu-1x at
# 2 GB, and 2 GB is not enough. The index retains ~427 MB, but *building* it
# holds the raw SQLite rows and the built objects alive at the same time, which
# peaked at ~1.5 GB RSS in testing and OOM-killed the 2 GB machine on first
# boot ("Ineffective mark-compacts near heap limit").
[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "4gb"
